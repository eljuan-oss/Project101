<!DOCTYPE html>
<html lang="en">
    
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aura Studios - Photography Portfolio</title>
    <!-- Google Montserrat font for clean, precise typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <!-- Tailwind CSS CDN for utility support -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Montserrat', -apple-system, BlinkMacSystemFont, sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        html, body {
            width: 100%;
            height: 100vh;
            overflow-x: hidden;
            background-color: #000000;
            color: #ffffff;
            display: flex;
            flex-direction: column;
        }

        /* Top Header Navigation bar */
        .site-header {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 2.25rem 3.5rem;
            z-index: 50;
        }

        /* White rectangular brand badge logo */
        .logo-badge {
            background-color: #ffffff;
            color: #000000;
            padding: 7px 18px;
            font-weight: 800;
            font-size: 0.85rem;
            letter-spacing: 2.5px;
            text-transform: uppercase;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.25);
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
        }

        .logo-badge:hover {
            background-color: #f1f1f1;
            transform: translateY(-1px);
        }

        /* Header Navigation Links */
        .nav-menu {
            display: flex;
            gap: 2.5rem;
            list-style: none;
            align-items: center;
        }

        .nav-link {
            color: rgba(255, 255, 255, 0.9);
            text-decoration: none;
            font-size: 0.7rem;
            font-weight: 600;
            letter-spacing: 2.8px;
            text-transform: uppercase;
            position: relative;
            padding-bottom: 6px;
            transition: color 0.3s ease;
        }

        .nav-link:hover {
            color: #ffffff;
        }

        /* Active underline bar matching OBJEKTIV reference styling */
        .nav-link.active::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 60%;
            height: 2px;
            background-color: rgba(255, 255, 255, 0.85);
            border-radius: 2px;
        }

        .hero-viewport {
            position: relative;
            width: 100%;
            flex: 1;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .hero-bg-image {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
            z-index: 1;
        }

        .hero-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(180deg, rgba(0, 0, 0, 0.3) 0%, rgba(0, 0, 0, 0) 50%, rgba(0, 0, 0, 0.4) 100%);
            z-index: 2;
            pointer-events: none;
        }

        .bottom-gallery-grid {
            width: 100%;
            height: 165px;
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 0;
            background-color: #000000;
            position: relative;
            z-index: 20;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
        }

        .gallery-card {
            position: relative;
            height: 100%;
            overflow: hidden;
            cursor: pointer;
        }

        .gallery-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
            filter: brightness(0.95) contrast(1.02);
            transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1), filter 0.4s ease;
        }

        .gallery-card:hover img {
            transform: scale(1.06);
            filter: brightness(1.08) contrast(1.1);
        }

        /* Hover caption mask overlay */
        .gallery-card-overlay {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.35);
            opacity: 0;
            transition: opacity 0.35s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 5;
        }

        .gallery-card:hover .gallery-card-overlay {
            opacity: 1;
        }

        .gallery-label {
            color: #ffffff;
            font-size: 0.68rem;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            border-bottom: 1.5px solid rgba(255, 255, 255, 0.85);
            padding-bottom: 2px;
            transform: translateY(6px);
            transition: transform 0.35s ease;
        }

        .gallery-card:hover .gallery-label {
            transform: translateY(0);
        }

        /* Responsive Breakpoints for Tablet & Mobile screens */
        @media (max-width: 992px) {
            .site-header {
                padding: 1.75rem 2rem;
            }
            .bottom-gallery-grid {
                height: 135px;
            }
        }

        @media (max-width: 768px) {
            .site-header {
                flex-direction: column;
                gap: 1.25rem;
                padding: 1.5rem 1rem;
            }
            .nav-menu {
                gap: 1.25rem;
            }
            .nav-link {
                font-size: 0.62rem;
                letter-spacing: 1.8px;
            }
            .bottom-gallery-grid {
                height: 110px;
            }
        }

        @media (max-width: 480px) {
            .bottom-gallery-grid {
                grid-template-columns: repeat(5, 1fr);
                height: 80px;
            }
            .gallery-label {
                font-size: 0.5rem;
                letter-spacing: 1px;
            }
        }
    </style>
</head>
<body>

    <header class="site-header">
        <!-- Logo Badge -->
        <a href="#" class="logo-badge" title="Aura Studios Home">
            AURA STUDIOS
        </a>

        <!-- Navigation Menu -->
        <nav aria-label="Main Navigation">
            <ul class="nav-menu">
                <li><a href="#" class="nav-link active">HOME</a></li>
                <li><a href="#" class="nav-link">PAGES</a></li>
                <li><a href="#" class="nav-link">PROOFING</a></li>
                <li><a href="#" class="nav-link">PORTFOLIO</a></li>
                <li><a href="#" class="nav-link">BLOG</a></li>
            </ul>
        </nav>
    </header>

    <main class="hero-viewport">
        <!-- Main Hero Shell Background Image -->
        <img 
            src="images (4).jpg" 
            alt="Hand holding seashell in translucent clear turquoise water" 
            class="hero-bg-image"
            onerror="this.onerror=null; this.src='https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=2000&q=80';"
        />
        <div class="hero-overlay"></div>
    </main>

    <section class="bottom-gallery-grid" aria-label="Featured Photography Grid">
        
        <!-- Gallery Item 1: Eye Close-Up -->
        <div class="gallery-card">
            <img 
                src="d35cee2b6520f2df4f5aac7dd64b7ae2.jpg" 
                alt="Close-up macro shot of blue human eye"
                onerror="this.onerror=null; this.src='https://images.unsplash.com/photo-1544005313-94ddf0286df2?auto=format&fit=crop&w=600&q=80';"
            />
            <div class="gallery-card-overlay">
                <span class="gallery-label">PORTRAITS</span>
            </div>
        </div>

        <!-- Gallery Item 2: Shell Water -->
        <div class="gallery-card">
            <img 
                src="images (4).jpg" 
                alt="Hand holding seashell underwater ripples"
                onerror="this.onerror=null; this.src='https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=600&q=80';"
            />
            <div class="gallery-card-overlay">
                <span class="gallery-label">ELEMENTS</span>
            </div>
        </div>

        <!-- Gallery Item 3: Vintage Pickup Truck -->
        <div class="gallery-card">
            <img 
                src="SFTV_classic-pickup-truck-vintage.jpg" 
                alt="Woman leaning out window of classic blue vintage truck"
                onerror="this.onerror=null; this.src='https://images.unsplash.com/photo-1519641471654-76ce0107ad1b?auto=format&fit=crop&w=600&q=80';"
            />
            <div class="gallery-card-overlay">
                <span class="gallery-label">LIFESTYLE</span>
            </div>
        </div>

        <!-- Gallery Item 4: Water Splash -->
        <div class="gallery-card">
            <img 
                src="Kristian-Irey-_-Death-to-Stock.jpg" 
                alt="Person splashing fresh water outdoors in lake"
                onerror="this.onerror=null; this.src='https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=600&q=80';"
            />
            <div class="gallery-card-overlay">
                <span class="gallery-label">ACTION</span>
            </div>
        </div>

        <!-- Gallery Item 5: Aerial Forest Road -->
        <div class="gallery-card">
            <img 
                src="images (5).jpg" 
                alt="Overhead aerial perspective of dense pine forest road"
                onerror="this.onerror=null; this.src='https://images.unsplash.com/photo-1448375240586-882707db888b?auto=format&fit=crop&w=600&q=80';"
            />
            <div class="gallery-card-overlay">
                <span class="gallery-label">LANDSCAPE</span>
            </div>
        </div>

    </section>

</body>
</html>
